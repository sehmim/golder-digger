[project]
name = "golddigger"
version = "0.1.0"
description = "Sample discovery by compatibility and controllable non-obviousness"
requires-python = ">=3.12"
dependencies = [
  "fastapi", "uvicorn", "pydantic",
  "numpy", "librosa", "soundfile",
  "torch", "torchaudio",
  # pinned: 5.15 is what the CLAP paths here are written against.
  # get_audio_features returns BaseModelOutputWithPooling (read .pooler_output,
  # not the object), and the processor's audio argument is `audio=` -- `audios=`
  # raises. Both have moved before; a major bump would move them again.
  "transformers>=5.15,<6",
  "beat-this",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
# Ingest runs the extractor when it can import this. No Windows build exists --
# that platform gets the Docker path in essentia_runner.py instead.
essentia = ["essentia; sys_platform != 'win32'"]

[project.scripts]
golddigger = "goldigger.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["goldigger*"]

[tool.pytest.ini_options]
# Bare `pytest` must not wander into golders-desktop/resources/engine -- the
# packaged interpreter ships torch's own test files, hundreds of which fail
# to even collect outside torch's harness.
testpaths = ["tests"]
